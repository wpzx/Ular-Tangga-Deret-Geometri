<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ular Tangga Deret Geometri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="game-container">
    
    <header class="game-header">
      <h1 class="title">🐍 ULAR TANGGA DERET GEOMETRI</h1>
      <!-- Teks Kelompok 4 sebagai Sakelar Rahasia -->
      <p class="subtitle">
        <span id="group-secret-toggle" class="secret-toggle hard-mode" title="Double click for secret mode">Kelompok 4</span>
      </p>
    </header>

    <div class="control-panel">
      <div class="card status-card">
        <div class="position-info">
          Posisi Pion: Kotak <span id="player-position-text">1</span>
        </div>
      </div>

      <div class="card dice-card">
        <div class="scene3d">
          <div id="cube" class="cube">
            <div class="cube-face front">1</div>
            <div class="cube-face back">6</div>
            <div class="cube-face right">3</div>
            <div class="cube-face left">4</div>
            <div class="cube-face top">2</div>
            <div class="cube-face bottom">5</div>
          </div>
        </div>
        <button id="btn-roll" class="btn-primary">🎲 Kocok Dadu</button>
      </div>
    </div>

    <main class="board-wrapper">
      <div id="board" class="board">
        
        <svg class="board-overlay" viewBox="0 0 500 500">
          <g id="ladder-1" class="editable-asset" transform="translate(210, 361) rotate(-15) scale(0.55, 0.45)">
            <image href="assets/ladder.svg" width="60" height="200"></image>
          </g>
          <g id="ladder-2" class="editable-asset" transform="translate(415, 251) rotate(-3) scale(0.55, 0.45)">
            <image href="assets/ladder.svg" width="60" height="200"></image>
          </g>
          <g id="ladder-3" class="editable-asset" transform="translate(15, 66) rotate(0) scale(0.55, 0.85)">
            <image href="assets/ladder.svg" width="60" height="200"></image>
          </g>

          <g id="snake-1" class="editable-asset" transform="translate(123, 51) rotate(6) scale(0.8, 0.9)">
            <image href="assets/snake1.svg" width="100" height="200"></image>
          </g>
          <g id="snake-2" class="editable-asset" transform="translate(319, 141) rotate(5) scale(0.9, 1.1)">
            <image href="assets/snake2.svg" width="100" height="200"></image>
          </g>
          <g id="snake-3" class="editable-asset" transform="translate(203, 220) rotate(30) scale(0.7, 0.75)">
            <image href="assets/snake1.svg" width="100" height="200"></image>
          </g>
        </svg>

        <div id="tokens-layer" class="tokens-layer">
          <div id="shared-token" class="token shared-pawn">1</div>
        </div>
      </div>
    </main>

  </div>

  <div id="event-modal" class="modal-overlay">
    <div class="modal-content card event-modal-card">
      <button class="modal-close-x" id="btn-close-x">&times;</button>
      <div id="modal-header-badge" class="event-badge">SOAL</div>
      <h3 id="modal-title">Tantangan Kelompok</h3>
      
      <div id="modal-body" class="modal-body-container"></div>

      <div id="modal-answer-box" class="answer-box hidden">
        <span class="text-bold">Kunci Jawaban:</span>
        <div id="modal-answer-content"></div>
      </div>

      <div class="modal-actions">
        <button id="btn-show-answer" class="btn-secondary">Lihat Jawaban</button>
        <button id="btn-answer-correct" class="btn-success">✅ Benar (Lanjut)</button>
        <button id="btn-answer-wrong" class="btn-danger">❌ Salah (Mundur 1)</button>
      </div>
    </div>
  </div>

  <div id="winner-modal" class="modal-overlay">
    <div class="modal-content card winner-card">
      <button class="modal-close-x" onclick="document.getElementById('winner-modal').classList.remove('active')">&times;</button>
      <div class="confetti-bg"></div>
      <img src="assets/trophy.svg" alt="Trophy" class="winner-trophy">
      <h1>🎉 SELAMAT!</h1>
      <h2 id="winner-name-text">Permainan Selesai!</h2>
      <p>Berhasil mencapai puncak Ular Tangga!</p>
      <button onclick="location.reload()" class="btn-primary" style="margin-top: 15px;">Main Lagi 🔄</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
